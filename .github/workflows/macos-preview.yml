name: macOS UI preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
      - run: go test -race ./...
      - run: go vet ./...
      - name: Native single-window and accessibility checks
        run: make test-macos-ui
      - name: Build Apple Silicon and Intel preview packages
        run: |
          go run ./scripts/build -os darwin -arch arm64
          go run ./scripts/build -os darwin -arch amd64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-desktop-preview
          path: |
            /private/tmp/clipare-native-ux/*.png
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 14
